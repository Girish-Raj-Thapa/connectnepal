x-backend-service: &backend-service
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  environment:
    DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-connectnepal.settings.prod}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: connectnepal-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-connectnepal}
      POSTGRES_USER: ${POSTGRES_USER:-connectnepal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-connectnepal}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-connectnepal} -d ${POSTGRES_DB:-connectnepal}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: connectnepal-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    <<: *backend-service
    container_name: connectnepal-api
    volumes:
      - backend_media:/app/backend/media
      - backend_static:/app/backend/staticfiles
      - backend_logs:/app/backend/logs
    healthcheck:
      test: ["CMD", "/app/docker/healthcheck-web.sh"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
        VITE_ENABLE_CHATBOT: ${VITE_ENABLE_CHATBOT:-true}
        VITE_ENABLE_RECOMMENDATIONS: ${VITE_ENABLE_RECOMMENDATIONS:-true}
    container_name: connectnepal-nginx
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - backend_static:/var/www/static:ro
      - backend_media:/var/www/media:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/nginx-health || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  celery-worker:
    <<: *backend-service
    container_name: connectnepal-celery-worker
    command: ["/app/docker/start-worker.sh"]
    volumes:
      - backend_media:/app/backend/media
      - backend_logs:/app/backend/logs
      - backend_static:/app/backend/staticfiles
    healthcheck:
      test: ["CMD", "/app/docker/healthcheck-worker.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 45s

  celery-beat:
    <<: *backend-service
    container_name: connectnepal-celery-beat
    command: ["/app/docker/start-beat.sh"]
    volumes:
      - backend_logs:/app/backend/logs
      - backend_static:/app/backend/staticfiles
    healthcheck:
      test: ["CMD", "/app/docker/healthcheck-beat.sh"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  backend_media:
  backend_static:
  backend_logs:
