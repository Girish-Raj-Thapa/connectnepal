<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-green.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Nepal</title>
    <!-- Anti-FOUC: apply stored theme before React hydrates -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('cn-theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
